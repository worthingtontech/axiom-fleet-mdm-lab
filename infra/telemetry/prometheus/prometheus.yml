# Prometheus -- scrapes Fleet server-health metrics + the AXIOM fleet-exporter
# (Fleet-API business metrics). Runs on the axiom-core bridge; reaches fleet by
# service DNS. The Fleet /metrics basic-auth password is NOT in Git -- the
# prom-init sidecar writes it from infra/.env into the prom-secrets volume, and
# we reference it via password_file.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    monitor: axiom

scrape_configs:
  # Fleet control-plane health: Go runtime, process RSS/CPU, per-handler HTTP
  # latency (http_request_duration_seconds). Business metrics (hosts online,
  # policy pass/fail) are NOT here -- Fleet does not expose them; see fleet-exporter.
  - job_name: fleet
    metrics_path: /metrics
    scheme: http
    basic_auth:
      username: axiom-prometheus
      password_file: /etc/prometheus/secrets/fleet_metrics_pw
    static_configs:
      - targets: ["fleet:1337"]
        labels:
          service: fleet-server

  # AXIOM fleet-exporter: polls the Fleet REST API and exposes business gauges
  # (axiom_hosts_online, axiom_policy_failing_hosts{...}, axiom_enclave_canary_ok).
  - job_name: fleet-exporter
    static_configs:
      - targets: ["fleet-exporter:9100"]
        labels:
          service: fleet-business

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
