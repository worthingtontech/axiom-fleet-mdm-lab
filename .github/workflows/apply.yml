name: Fleet GitOps Apply

# Trusted, main-only application of desired state to the LIVE Fleet server.
# Runs on the self-hosted LAN runner -- the only box that can reach
# https://fleet.axiom.lab. Never fork-triggered: `push` to main happens only
# after a maintainer merges a reviewed PR (ADR-0007).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One apply at a time; do NOT cancel an in-flight apply (a half-applied server
# is worse than a queued one).
concurrency:
  group: fleet-gitops-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: fleetctl gitops (apply to live Fleet)
    runs-on: [self-hosted, Windows, fleet-apply]
    # The maintainer-gated `production` environment (required reviewers +
    # main-only deployment-branch rule) is the human gate on any mutation of the
    # live server (ADR-0007 / runbooks/ci-cd-setup.md).
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Apply GitOps (dry-run, then apply)
        run: ./gitops.sh
        env:
          FLEET_URL: ${{ secrets.FLEET_URL }}
          FLEET_API_TOKEN: ${{ secrets.FLEET_API_TOKEN }}
          FLEET_GLOBAL_ENROLL_SECRET: ${{ secrets.FLEET_GLOBAL_ENROLL_SECRET }}
