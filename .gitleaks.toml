# gitleaks configuration for the AXIOM Fleet GitOps lab.
# Extends the bundled default ruleset, then allowlists the intentional,
# NON-secret env-var *references* this repo commits. The real values live in
# GitHub Actions secrets and the host .env -- never in Git.
#
# NB: gitleaks-action requires a (free) GITLEAKS_LICENSE only on an ORG-owned repo.
# This repo is a PERSONAL account -> none needed. Add one (from https://gitleaks.io,
# wired in .github/workflows/gitleaks.yml) if/when it moves under the LLC org.

title = "AXIOM Fleet GitOps gitleaks config"

[extend]
# Begin from gitleaks' built-in rules, then layer the allowlist below.
useDefault = true

[[allowlists]]
description = "Fleet GitOps env-var placeholders (references, not secrets)"
# OR: a finding is allowlisted if it matches ANY listed condition.
condition = "OR"
# The literal `$FLEET_*` placeholders committed in gitops/*.yml and examples.
regexes = [
  '''\$FLEET_[A-Z0-9_]*ENROLL_SECRET''',
  '''\$FLEET_API_TOKEN''',
]
# Example/fixture files carry placeholder tokens by design.
paths = [
  '''.*\.example\.ya?ml''',
  '''.*/fixtures/.*''',
]

[[allowlists]]
description = "Public Microsoft generic (KMS client setup) product keys -- PUBLISHED by Microsoft (learn.microsoft.com volume activation), NOT secrets. They appear in runbooks/answer files to document edition choices. gitleaks' entropy check false-positives them as generic-api-key."
condition = "OR"
regexes = [
  '''YTMG3-N6DKC-DKB77-7M9GH-8HVX7''',   # Windows 11 Home
  '''VK7JG-NPHTM-C97JM-9MPGT-3V66T''',   # Windows 11 Pro
  '''XGVPP-NMH47-7TTHJ-W3FW7-8HV2C''',   # Windows 11 Enterprise
]
