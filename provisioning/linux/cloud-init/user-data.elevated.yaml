#cloud-config
# AXIOM Linux node -- ELEVATED trust tier (High-Trust Enclave).
# Same as the standard template PLUS two /etc/axiom markers that place this host in the
# elevated tier (ADR-0003). new-linux-vm.ps1 substitutes the hostname.
hostname: __HOSTNAME__
manage_etc_hosts: false
users:
  - name: axiom
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    lock_passwd: false
    plain_text_passwd: 'axiom'
    shell: /bin/bash
ssh_pwauth: true
write_files:
  # 10.0.2.2 = VirtualBox NAT gateway = the Windows host running Caddy:443.
  - path: /etc/hosts
    append: true
    content: "10.0.2.2 fleet.axiom.lab\n"
  # Trust-tier marker -- human/audit readable (ADR-0003).
  - path: /etc/axiom/trust-tier
    content: "elevated\n"
    permissions: '0644'
  # Sentinel PATH the dynamic high-trust-enclave label matches on PRESENCE
  # (osquery's file table has no content column). See labels/high-trust-enclave.label.yaml.
  - path: /etc/axiom/tier.d/elevated
    content: ""
    permissions: '0644'
runcmd:
  - [sh, -c, "mkdir -p /mnt/seed && (mount -L CIDATA /mnt/seed || mount /dev/sr0 /mnt/seed || mount /dev/sr1 /mnt/seed)"]
  - [sh, -c, "apt-get install -y /mnt/seed/fleet-osquery.deb"]
  - [sh, -c, "umount /mnt/seed || true"]
final_message: "AXIOM __HOSTNAME__ (elevated) cloud-init done after $UPTIME s"
