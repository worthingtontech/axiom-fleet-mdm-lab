#cloud-config
# AXIOM Linux node -- ELEVATED trust tier (High-Trust Enclave).
# Same as the standard template PLUS two /etc/axiom markers that place this host in the
# elevated tier (ADR-0003). new-linux-vm.ps1 substitutes the hostname.
hostname: __HOSTNAME__
manage_etc_hosts: false
users:
  - name: axiom
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    lock_passwd: false
    plain_text_passwd: 'axiom'
    shell: /bin/bash
    ssh_authorized_keys:
      # AXIOM lab key (C:\vms\axiom_key) -- non-interactive SSH for ops/demos.
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILqzsC4CAfs9hjXpvsCuluEsULBxRmDe9q5ziC5DuWDg axiom-lab
ssh_pwauth: true
write_files:
  # 10.0.2.2 = VirtualBox NAT gateway = the Windows host running Caddy:443.
  - path: /etc/hosts
    append: true
    content: "10.0.2.2 fleet.axiom.lab\n"
  # Trust-tier marker -- human/audit readable (ADR-0003).
  - path: /etc/axiom/trust-tier
    content: "elevated\n"
    permissions: '0644'
  # Sentinel PATH the dynamic high-trust-enclave label matches on PRESENCE
  # (osquery's file table has no content column). See labels/high-trust-enclave.label.yaml.
  - path: /etc/axiom/tier.d/elevated
    content: ""
    permissions: '0644'
runcmd:
  # Enclave FIM canary for policy #8 (weights-cache integrity, MITRE T1565.001).
  # Written byte-exactly BEFORE the fleetd install so the file's sha256 matches the
  # hash pinned in the Fleet policy (printf's \\n must land as a single newline).
  - [ sh, -c, "mkdir -p /opt/axiom/weights-cache && printf 'AXIOM-CANARY-v1\\n' > /opt/axiom/weights-cache/canary.bin && chown root:root /opt/axiom/weights-cache/canary.bin && chmod 0640 /opt/axiom/weights-cache/canary.bin" ]
  - [sh, -c, "mkdir -p /mnt/seed && (mount -L CIDATA /mnt/seed || mount /dev/sr0 /mnt/seed || mount /dev/sr1 /mnt/seed)"]
  - [sh, -c, "apt-get install -y /mnt/seed/fleet-osquery.deb"]
  - [sh, -c, "umount /mnt/seed || true"]
  # Elevated-bar host FIM (policy #10). --no-install-recommends is deliberate: the default
  # recommends pull in postfix, whose SMTP daemon opens 0.0.0.0:25 -- which policy #2
  # (no unexpected inbound listeners) would correctly flag as new attack surface.
  - [sh, -c, "DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aide aide-common"]
final_message: "AXIOM __HOSTNAME__ (elevated) cloud-init done after $UPTIME s"
