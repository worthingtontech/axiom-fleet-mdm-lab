#cloud-config
# AXIOM Linux node — ELEVATED trust tier (High-Trust Enclave).
# Identical to the standard template PLUS two /etc/axiom markers that place this host
# in the elevated tier. Template: new-linux-vm.ps1 substitutes __HOSTNAME__ and inlines
# __ROOTCA_PEM__. Delivered as `user-data` on a NoCloud CIDATA seed ISO.
hostname: __HOSTNAME__

# We manage /etc/hosts ourselves (the fleet.axiom.lab -> NAT-gateway line below).
# cloud-init must NOT rewrite it, or our mapping is clobbered on every boot.
manage_etc_hosts: false

users:
  - name: axiom
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    lock_passwd: false
    plain_text_passwd: 'axiom'
    shell: /bin/bash
ssh_pwauth: true

# OS-level trust for the mkcert root CA (belt-and-suspenders: fleetd already has the
# CA baked in via `fleetctl package --fleet-certificate`, but this trusts it for curl,
# apt-over-https, and anything else on the box). __ROOTCA_PEM__ is replaced with the
# PEM body, each line indented 6 spaces, by new-linux-vm.ps1.
ca_certs:
  trusted:
    - |
__ROOTCA_PEM__

write_files:
  # 10.0.2.2 is the VirtualBox NAT gateway == the Windows host, which runs Caddy:443.
  # TLS still validates because verification is on the hostname (in the mkcert leaf SAN),
  # not the IP. See ADR-0002 / ADR-0004 and provisioning/README.md.
  - path: /etc/hosts
    append: true
    content: "10.0.2.2 fleet.axiom.lab\n"

  # Trust-tier marker (human/audit readable). Per ADR-0003, tiering on Fleet Free is done
  # with self-scoping policy SQL keyed on this file's CONTENT.
  - path: /etc/axiom/trust-tier
    content: "elevated\n"
    permissions: '0644'

  # Sentinel PATH the dynamic `high-trust-enclave` label matches. osquery's `file` table
  # has NO content column, so the label query keys on the PRESENCE of this path, not the
  # trust-tier file's content. See labels/high-trust-enclave.label.yaml.
  - path: /etc/axiom/tier.d/elevated
    content: ""
    permissions: '0644'

runcmd:
  # Mount the CIDATA seed by label (fallbacks for sr0/sr1), install the Git-tracked
  # fleetd .deb offline from the seed; apt still resolves deps over NAT internet.
  - [sh, -c, "mkdir -p /mnt/seed && (mount -L CIDATA /mnt/seed || mount /dev/sr0 /mnt/seed || mount /dev/sr1 /mnt/seed)"]
  - [sh, -c, "apt-get install -y /mnt/seed/fleet-osquery.deb"]
  - [sh, -c, "umount /mnt/seed || true"]
