# yamllint configuration for the AXIOM Fleet GitOps repo.
# Consumed by PR CI (.github/workflows/pr-ci.yml -> "lint" job): `yamllint -c .yamllint.yml .`
#
# Deliberately lenient where a strict default would fight legitimate GitOps /
# GitHub-Actions YAML:
#   - osquery SQL and cert-SAN lists run long        -> line-length is a warning
#   - GitHub Actions spells the trigger key `on:`     -> truthy check-keys disabled
#   - Fleet GitOps files have no `---` doc marker     -> document-start disabled
extends: default

rules:
  # Fleet policy SQL and TLS SAN lists get long; warn, don't fail the build.
  line-length:
    max: 200
    level: warning
  # Fleet GitOps files (and these workflows) start straight into keys.
  document-start: disable
  # Don't treat `on:` / `yes` / `no` style *keys* as booleans (Actions `on:`).
  truthy:
    check-keys: false
  # A single space between content and an inline `#` comment is enough.
  comments:
    min-spaces-from-content: 1
  # gitops/default.yml is machine-generated (fleetctl generate-gitops) and must
  # stay generator-shaped so the drift job's diff stays clean -- so accept the
  # generator's block-sequence indentation rather than reformat it.
  indentation:
    spaces: consistent
    indent-sequences: whatever
    check-multi-line-strings: false

# cloud-init files require a verbatim `#cloud-config` first line (no space after
# the `#`), which yamllint's comments rule flags -- and cloud-init validates them
# itself. Exclude them from this lint.
ignore: |
  provisioning/linux/cloud-init/*.yaml
